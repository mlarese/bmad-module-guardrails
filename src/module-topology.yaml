# Topologia di Guardrails: il bundle completo e i moduli tematici derivati.
#
# Questo file non è letto dall'installer BMad. Lo legge `tools/build_modules.py`,
# che da qui genera in `dist/` un repository per ogni modulo tematico. Questo
# repository resta la fonte unica: i repository derivati non si modificano a mano,
# si rigenerano.
#
# Il bundle `grl` resta la superficie completa — ventuno figure e sedici workflow in
# un'unica installazione. I moduli tematici sono alternative al bundle, non
# aggiunte: installano le stesse skill con lo stesso nome, quindi bundle e moduli
# tematici non convivono nello stesso progetto.
#
# Le due skill del core (`core.skills`) sono duplicate in ogni modulo tematico con
# il prefisso del modulo — `grg-profile`, `grg-board` — perché un
# modulo deve funzionare da solo. La memoria condivisa resta invece la stessa per
# tutti (`core.shared_memory`): due moduli installati insieme leggono e scrivono
# un solo profilo di progetto.

version: 2

bundle:
  code: grl
  name: Guardrails
  repo: bmad-module-guardrails
  mode: compatibility-bundle
  description: "Bundle completo Guardrails: tutte le figure e i workflow in un'unica installazione."
core:
  # Duplicate in ogni modulo tematico, rinominate con il codice del modulo.
  skills:
    - grl-profile
    - grl-board
  # Non cambia mai: è il punto in cui i moduli si incontrano.
  shared_memory: "{project-root}/_bmad/memory/grl-shared"

modules:
  - code: grg
    name: Guardrails Governance
    repo: bmad-module-guardrails-governance
    status: derived
    purpose: "Privacy, legale, licenze, soglie di applicabilità normativa e aggiornamenti legali live."
    description: "Tre figure di presidio su privacy e GDPR, legale e licenze, compliance normativa — più un workflow di ricerca live sugli aggiornamenti legali. Separano l'obbligo vero dalla prassi diffusa, e dicono quali norme non si applicano."
    about: "Guardrails Governance: 3 review agents and 4 controlled BMad workflows for privacy, legal and licensing, regulatory compliance, and live legal updates."
    skills:
      - grl-agent-privacy
      - grl-agent-legal
      - grl-agent-compliance
      - grl-legal-updates
      - grl-automation
  - code: gre
    name: Guardrails Engineering
    repo: bmad-module-guardrails-engineering
    status: derived
    purpose: "Architettura del codice e dei database, diagnosi di bug e regressioni, punti di blocco, sicurezza, operations, impianto delle applicazioni AI e configurazione di prodotto."
    description: "Otto figure di presidio su disciplina architetturale del codice, punti in cui il software non lascia una via d'uscita, design e architettura dei database, scrittura firmware embedded e sistemi real-time, sicurezza applicativa, infrastruttura e operatività, impianto delle applicazioni che usano modelli linguistici, configurazione di prodotto a partire dal documento del cliente — più `grl-bug-finder` per la diagnosi read-only di bug e regressioni, `grl-automation` per i processi ripetibili e `grl-toolchain` per trovare, valutare e installare skill e server MCP su ogni harness. Ogni raccomandazione porta il costo di non seguirla."
    about: "Guardrails Engineering: 8 review agents and 5 controlled BMad workflows for code architecture, blocking points, database design, firmware, application security, infrastructure, AI applications, product configuration, bug diagnosis, automation, and installing skills and MCP servers across agent harnesses."
    skills:
      - grl-agent-architecture
      - grl-agent-blockers
      - grl-agent-database
      - grl-agent-firmware
      - grl-agent-security
      - grl-agent-ops
      - grl-agent-ai
      - grl-agent-product-config
      - grl-bug-finder
      - grl-automation
      - grl-toolchain
  - code: grf
    name: Guardrails Fiscal
    repo: bmad-module-guardrails-fiscal
    status: derived
    purpose: "Fonti fiscali e legali applicate, contabilità operativa, bandi, finanza agevolata e aggiornamenti fiscali live."
    description: "Presidio fiscale e di finanza agevolata: requisiti, scadenze, spese ammissibili e rendicontazione, sempre con fonte primaria e data di verifica. Include un workflow di ricerca live sugli aggiornamenti fiscali, i bandi e gli incentivi."
    about: "Guardrails Fiscal: 1 review agent and 4 controlled BMad workflows for tax, accounting operations, grants, incentives, and live fiscal updates."
    skills:
      - grl-agent-fiscal
      - grl-fiscal-updates
      - grl-automation
  - code: grh
    name: Guardrails Health
    repo: bmad-module-guardrails-health
    status: derived
    purpose: "Dominio clinico e qualificazione del software sanitario."
    description: "Presidio del dominio clinico sullo sviluppo di software sanitario — modello dati clinico e codifiche, interoperabilità, sicurezza del paziente, workflow reale di reparto — più il percorso guidato di qualificazione del software come dispositivo medico."
    about: "Guardrails Health: 1 review agent and 4 controlled BMad workflows for clinical data, healthcare interoperability, patient safety, and medical-device qualification."
    skills:
      - grl-agent-health
      - grl-mdsw
      - grl-automation
  - code: grw
    name: Guardrails Web Experience
    repo: bmad-module-guardrails-web
    status: derived
    purpose: "Qualità visiva, findability, landing page, siti, social content, immagini generate e paid media."
    description: "Sei figure di presidio su qualità visiva dell'interfaccia, SEO, media buying/ADV, strategia social, creative video e generazione di immagini con modelli AI, più i workflow che costruiscono landing page e siti, coordinano campagne e producono contenuti social e pacchetti creativi senza pubblicazione implicita. Contro le pagine generiche, le promesse di ranking, i post senza piano e la spesa senza misura."
    about: "Guardrails Web Experience: 6 review agents and 7 controlled BMad workflows for visual quality, search, web delivery, paid media, organic social content, creative video, and AI image generation."
    skills:
      - grl-agent-ui-critic
      - grl-agent-seo
      - grl-agent-ads
      - grl-agent-social
      - grl-agent-creative
      - grl-agent-imaging
      - grl-web
      - grl-ads
      - grl-social
      - grl-social-creative
      - grl-automation
  - code: gpm
    name: Guardrails Paid Media
    repo: bmad-module-guardrails-paid-media
    status: derived
    purpose: "Strategia paid media, Google Ads, ADV, tracking, consenso, creatività, immagini generate e preflight controllato."
    description: "Otto figure di presidio su paid media, SEO, design, privacy, legale, social content, creative video e generazione di immagini con modelli AI, più `grl-ads` per audit, piani, tracking e preflight paid, `grl-social` per il contenuto organico, `grl-social-creative` per gli asset e `grl-automation` per i passaggi ripetitivi. Dalia tiene la spesa sotto controllo: nessuna campagna o creatività si pubblica senza evidenze, approvazione e rollback."
    about: "Guardrails Paid Media: 8 review agents and 6 controlled BMad workflows for paid media, Google Ads, tracking, consent, social content, creative production, and AI image generation."
    skills:
      - grl-agent-privacy
      - grl-agent-legal
      - grl-agent-ui-critic
      - grl-agent-seo
      - grl-agent-ads
      - grl-agent-social
      - grl-agent-creative
      - grl-agent-imaging
      - grl-ads
      - grl-social
      - grl-social-creative
      - grl-automation
  - code: grv
    name: Guardrails Revenue
    repo: bmad-module-guardrails-revenue
    status: derived
    purpose: "Revenue management alberghiero, pricing, forecast, profitto e integrazioni PMS/Channel Manager."
    description: "Rhea e tre workflow per audit read-only dei dati, scenari di pricing e preflight PMS/Channel Manager. Usa il modello QuoProfit/RevD come conoscenza interna, ricerca di dominio verificabile e calcoli deterministici; nessuna pubblicazione verso sistemi esterni senza un gate esplicito, dry-run, approvazione e rollback."
    about: "Guardrails Revenue: 1 review agent and 6 controlled BMad workflows for hotel revenue management, pricing, forecasting, profit, and PMS/Channel Manager integrations."
    skills:
      - grl-agent-revenue
      - grl-revenue-audit
      - grl-revenue-plan
      - grl-revenue-preflight
      - grl-automation
  - code: gau
    name: Guardrails Automation
    repo: bmad-module-guardrails-automation
    status: derived
    purpose: "Orchestrazione di processi ripetitivi fra sviluppo software, diagnosi di bug, database, legale, fisco, design, architettura, medicina, paid media, revenue management e configurazione di prodotto."
    description: "Ventuno figure Guardrails e sedici workflow necessari a instradare processi software, database, punti di blocco, firmware embedded, diagnosi di bug e regressioni, legali, fiscali, di design, architettura, medicina, web, WordPress, paid media, social/content, creative video, revenue management e configurazione di prodotto. I workflow social coprono strategia, calendario, contenuti e pacchetti creativi; i tre workflow revenue coprono audit, scenari di pricing e preflight PMS/Channel Manager; `grl-bug-finder` costruisce riproduzioni, evidenze e test di regressione senza correggere; `grl-wordpress-delivery` porta un sito dal modello dei contenuti al release gate; `grl-automation` porta ogni richiesta da intake e read-only a piano, dry-run, approvazioni, esecuzione osservabile e rollback, senza trasformare un agente in un esecutore autonomo; `grl-toolchain` trova, valuta e installa skill e server MCP su ogni harness con la sintassi di quell'harness."
    about: "Guardrails Automation: 21 review agents and 16 controlled BMad workflows for routing repeatable processes across software, databases, bug diagnosis, blocking points, firmware, legal, tax, design, healthcare, web, WordPress, paid media, social content, video, AI imaging, revenue management, product configuration, and agent-harness tooling."
    skills:
      - grl-agent-privacy
      - grl-agent-security
      - grl-agent-legal
      - grl-agent-compliance
      - grl-agent-fiscal
      - grl-agent-ui-critic
      - grl-agent-architecture
      - grl-agent-blockers
      - grl-agent-database
      - grl-agent-firmware
      - grl-agent-ops
      - grl-agent-health
      - grl-agent-ai
      - grl-agent-wordpress
      - grl-agent-seo
      - grl-agent-ads
      - grl-agent-social
      - grl-agent-creative
      - grl-agent-imaging
      - grl-agent-revenue
      - grl-agent-product-config
      - grl-legal-updates
      - grl-fiscal-updates
      - grl-mdsw
      - grl-web
      - grl-ads
      - grl-social
      - grl-social-creative
      - grl-revenue-audit
      - grl-revenue-plan
      - grl-revenue-preflight
      - grl-wordpress-delivery
      - grl-bug-finder
      - grl-automation
      - grl-toolchain
  - code: gwp
    name: Guardrails WordPress
    repo: bmad-module-guardrails-wordpress
    status: derived
    purpose: "WordPress a componenti e consegna controllata fino al release gate."
    description: "Presidio dell'architettura e della consegna WordPress a componenti: Gutenberg, Elementor confinato dove serve, ACF e campi custom, template e Media Library, con creazione, ripresa, migrazione e verifica fino al release gate."
    about: "Guardrails WordPress: 1 review agent and 4 controlled BMad workflows for component-based WordPress architecture and controlled delivery through the release gate."
