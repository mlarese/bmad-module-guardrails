    status: derived
    purpose: "Customer journey, visual storytelling, search system contestuali, pagine landing/home di riferimento con sezioni, curtain, gallery e cinematica, landing scroll-driven statiche, video-to-scroll da sorgenti autorizzate, qualità visiva, findability, landing page, siti, social content, immagini generate e paid media."
    description: "Sette figure di presidio su customer journey e visual storytelling situati, pagine landing/home di riferimento con sezioni, CTA, curtain, aperture a tenda, gallery e cinematica, regia di landing scroll-driven statiche da asset online verificati e piani video-to-scroll da sorgenti autorizzate, qualità visiva dell'interfaccia, SEO, media buying/ADV, strategia social, creative video e generazione di immagini con modelli AI, più i workflow che cercano sorgenti video, estraggono pacchetti di frame e costruiscono landing page e siti, coordinano campagne e producono contenuti social e pacchetti creativi senza pubblicazione implicita. Contro i percorsi generici, le pagine anonime, le promesse di ranking, i post senza piano e la spesa senza misura."
    about: "Guardrails Web Experience: 7 review agents and 8 controlled BMad workflows for customer journeys, landing/home references, curtain/gallery cinematics, static and video-source scroll storytelling, licensed video frames, visual quality, search, web delivery, paid media, social content, creative video, and AI imaging."
