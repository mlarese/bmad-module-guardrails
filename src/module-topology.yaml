    repo: bmad-module-guardrails-automation
    status: derived
    purpose: "Orchestrazione di processi ripetitivi fra sviluppo software, diagnosi di bug, backlog di issue, database, legale, fisco, design, customer journey, visual storytelling, pagine landing/home di riferimento, curtain/gallery, scroll-world, video-to-scroll, search system, architettura, medicina, paid media, revenue management e configurazione di prodotto."
    description: "Ventitré figure Guardrails e ventuno workflow necessari a instradare processi software, database, punti di blocco, firmware embedded, diagnosi di bug e regressioni, legali, fiscali, di design, customer journey, visual storytelling, pagine landing/home di riferimento, landing scroll-driven statiche, ricerca di sorgenti video e pacchetti di frame, piani video-to-scroll da sorgenti autorizzate, search system, architettura, medicina, web, WordPress, paid media, social/content, creative video, revenue management e configurazione di prodotto. I workflow social coprono strategia, calendario, contenuti e pacchetti creativi; i tre workflow revenue coprono audit, scenari di pricing e preflight PMS/Channel Manager; `grl-bug-finder` costruisce riproduzioni, evidenze e test di regressione senza correggere; `grl-wordpress-delivery` porta un sito dal modello dei contenuti al release gate; `grl-video-to-scroll` raccoglie contesto, verifica sorgenti ed estrae frame solo da file locali autorizzati; `grl-automation` porta ogni richiesta da intake e read-only a piano, dry-run, approvazioni, esecuzione osservabile e rollback, senza trasformare un agente in un esecutore autonomo; `grl-toolchain` trova, valuta e installa skill e server MCP su ogni harness con la sintassi di quell'harness."
    about: "Guardrails Automation: 23 review agents and 21 controlled BMad workflows for software, issue backlogs, legal, tax, design, customer journeys, landing/home references, curtain/gallery cinematics, scroll storytelling, video frame packages, search, healthcare, web, WordPress, paid/social/video, AI imaging, revenue, product config, and agent tooling."
